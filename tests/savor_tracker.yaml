tracker_type: botsort  
# LOWER this so the tracker is more 'brave' in keeping a track active
track_high_thresh: 0.15  # Was 0.5. Now it stays active even if detection is weak.
track_low_thresh: 0.05  # Very lenient safety net for blurry movement
new_track_thresh: 0.8   # HIGHER this so it's harder to start a 'Ghost' ID

# INCREASE this to give the tracker a longer memory
track_buffer: 60       # 120 frames = 4 seconds of 'memory' if the Milo vanishes

# LENIENT matching
match_thresh: 0.95     # Higher = more lenient matching for jumping IDs   
gmc_method: sparseOptFlow 
with_reid: True        
fuse_score: True        
proximity_thresh: 0.5
appearance_thresh: 0.15
model: auto